<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>审美者 · Aesthete</title>
  <style> 
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --ink: #1a1a18;
      --paper: #f5f2ec;
      --mist: #9a9488;
      --accent: #5c6b4a;
      --thin: 300;
      --regular: 400;
    }

    html, body {
      height: 100%;
      background: var(--paper);
      color: var(--ink);
      font-family: 'Georgia', 'Noto Serif SC', serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .container {
      max-width: 480px;
      width: 100%;
      text-align: center;
    }

    .eyebrow {
      font-size: 0.7rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--mist);
      font-family: 'Helvetica Neue', sans-serif;
      font-weight: var(--thin);
      margin-bottom: 2.5rem;
    }

    .title-zh {
      font-size: clamp(2.8rem, 10vw, 4.5rem);
      font-weight: var(--thin);
      letter-spacing: 0.15em;
      line-height: 1;
      color: var(--ink);
      margin-bottom: 0.4rem;
    }

    .title-en {
      font-size: 0.75rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--mist);
      font-family: 'Helvetica Neue', sans-serif;
      font-weight: var(--thin);
      margin-bottom: 3.5rem;
    }

    .divider {
      width: 1px;
      height: 48px;
      background: var(--accent);
      margin: 0 auto 3.5rem;
      opacity: 0.4;
    }

    .tagline {
      font-size: 0.95rem;
      line-height: 2;
      color: var(--mist);
      font-weight: var(--thin);
      letter-spacing: 0.05em;
      margin-bottom: 4rem;
    }

    .tagline em {
      font-style: normal;
      color: var(--ink);
    }

    .status {
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--accent);
      font-family: 'Helvetica Neue', sans-serif;
      font-weight: var(--regular);
      opacity: 0.7;
    }

    .dot {
      display: inline-block;
      width: 4px;
      height: 4px;
      background: var(--accent);
      border-radius: 50%;
      margin-right: 0.6em;
      vertical-align: middle;
      animation: pulse 2.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .dot { animation: none; opacity: 0.6; }
    }
  </style>
</head>
<body>
  <div class="container">
    <p class="eyebrow">shenmei.org</p>
    <h1 class="title-zh">审美者</h1>
    <p class="title-en">Aesthete</p>
    <div class="divider"></div>
    <p class="tagline">
      <em>人选的</em>，不是算法推的。<br>
      审美者的精选片单，即将上线。
    </p>
    <p class="status">
      <span class="dot"></span>即将上线
    </p>
  </div>
</body>
</html>
