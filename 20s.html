<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>20s - EOVO Media</title>
    <style>
        /* 梅娘的专属 CSS 调教：暗黑极简与紫罗兰呼吸感 */
        body {
            margin: 0;
            padding: 0;
            background-color: #0d0d0d; /* 极夜黑背景，让视觉完全聚焦于视频 */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        
        .video-container {
            /* 注入咱们基地的专属灵魂色 #4a3570 作为光晕阴影 */
            box-shadow: 0 10px 30px rgba(74, 53, 112, 0.6); 
            border-radius: 12px;
            overflow: hidden;
            max-width: 90vw;
            background-color: #000;
        }

        video {
            display: block;
            max-width: 100%;
            max-height: 85vh;
            border-radius: 12px;
            outline: none;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <video controls preload="metadata">
            <source src="20s.mp4" type="video/mp4">
            您的浏览器不支持 HTML5 视频标签，请升级浏览器。
        </video>
    </div>

</body>
</html>
